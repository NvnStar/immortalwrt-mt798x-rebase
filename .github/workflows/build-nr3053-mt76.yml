name: Build NR3053 (mt76)

# Builds Viettel NR3053 firmware from official ImmortalWrt openwrt-25.12
# with the open-source mt76 Wi-Fi driver. Outputs FIT images compatible
# with the ImmortalWrt U-Boot already installed on the device.

on:
  push:
    branches: [nr3053-mt76]
    paths:
      - "package/**"
      - "target/**"
      - "include/**"
      - "feeds.conf.default"
      - "Makefile"
      - "rules.mk"
      - ".github/workflows/build-nr3053-mt76.yml"
  workflow_dispatch:

concurrency:
  group: build-nr3053-mt76-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CACHE_PREFIX: nr3053-mt76-filogic-ubuntu2604

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - name: Maximize build disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses5-dev libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget curl libelf-dev \
            subversion swig time device-tree-compiler

      - name: Restore toolchain cache
        id: cache-toolchain
        uses: actions/cache/restore@v5
        with:
          path: |
            staging_dir/host
            staging_dir/toolchain-aarch64_cortex-a53_gcc-*
          key: ${{ env.CACHE_PREFIX }}-toolchain-${{ hashFiles('feeds.conf.default', 'toolchain/**', 'tools/**') }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-toolchain-

      - name: Restore download cache
        uses: actions/cache/restore@v5
        with:
          path: dl
          key: ${{ env.CACHE_PREFIX }}-dl-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-dl-

      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ${{ env.CACHE_PREFIX }}-ccache-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-ccache-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_viettel_nr3053=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_DEVEL=y
          CONFIG_CCACHE=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_irqbalance=y
          CONFIG_PACKAGE_kmod-tcp-bbr=y
          EOF
          make defconfig
          # Fail fast if the device or required packages dropped out of the config
          grep -q '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_viettel_nr3053=y' .config
          grep -q '^CONFIG_CCACHE=y' .config
          grep -qE '^CONFIG_PACKAGE_kmod-mt7915e=(y|m)' .config
          grep -qE '^CONFIG_PACKAGE_kmod-mt7981-firmware=(y|m)' .config
          grep -qE '^CONFIG_PACKAGE_mt7981-wo-firmware=(y|m)' .config
          grep -q '^CONFIG_PACKAGE_irqbalance=y' .config
          grep -q '^CONFIG_PACKAGE_kmod-tcp-bbr=y' .config

      - name: Install first-boot defaults
        run: |
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-nr3053-defaults <<'EOF'
          #!/bin/sh
          # Enable irqbalance on dual-core MT7981B (ships disabled by default)
          uci -q set irqbalance.@irqbalance[0].enabled='1'
          uci -q commit irqbalance

          # Prefer IP-literal NTP servers first so time syncs before DNS/DNSSEC
          uci -q delete system.ntp.server
          uci add_list system.ntp.server='162.159.200.1'
          uci add_list system.ntp.server='216.239.35.0'
          uci add_list system.ntp.server='time.cloudflare.com'
          uci add_list system.ntp.server='time1.google.com'
          uci add_list system.ntp.server='0.openwrt.pool.ntp.org'
          uci commit system

          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-nr3053-defaults

      - name: Download sources
        run: make download -j8

      - name: Build
        run: |
          make -j"$(nproc)" || make -j1 V=s

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp bin/targets/mediatek/filogic/*viettel_nr3053*initramfs-recovery.itb dist/
          cp bin/targets/mediatek/filogic/*viettel_nr3053*squashfs-sysupgrade.itb dist/
          cp bin/targets/mediatek/filogic/*viettel_nr3053*.manifest dist/ 2>/dev/null || true
          if [ -d bin/targets/mediatek/filogic/packages ]; then
            tar -czf dist/kmods-packages.tar.gz -C bin/targets/mediatek/filogic packages
          fi
          cp .config dist/config.buildinfo
          (cd dist && sha256sum * > sha256sums)
          ls -la dist

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: immortalwrt-nr3053-mt76-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Free disk before cache save
        if: always()
        run: |
          rm -rf build_dir bin tmp logs feeds staging_dir/target-* staging_dir/packages
          df -h /

      - name: Save toolchain cache
        if: always() && steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            staging_dir/host
            staging_dir/toolchain-aarch64_cortex-a53_gcc-*
          key: ${{ env.CACHE_PREFIX }}-toolchain-${{ hashFiles('feeds.conf.default', 'toolchain/**', 'tools/**') }}

      - name: Save download cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: dl
          key: ${{ env.CACHE_PREFIX }}-dl-${{ github.run_id }}

      - name: Prune ccache
        if: always()
        run: |
          mkdir -p .ccache
          if [ -x staging_dir/host/bin/ccache ]; then
            CCACHE_DIR="$PWD/.ccache" staging_dir/host/bin/ccache -M 2G -c
            CCACHE_DIR="$PWD/.ccache" staging_dir/host/bin/ccache -s
          fi

      - name: Upload ccache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ${{ env.CACHE_PREFIX }}-ccache-${{ github.run_id }}
